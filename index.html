<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ざつちゃんねる　匿名掲示板</title>
    <style>
        :root {
            --bg-color: #efefef;
            --thread-bg: #fff;
            --text-color: #333;
            --link-color: #0000ff;
            --border-color: #ccc;
            --header-bg: #e0e0e0;
            --accent-color: #ff4500;
            --sidebar-width: 300px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "MS PGothic", "IPAMonaPGothic", "Saitamaar", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-bg);
            padding: 10px 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; font-size: 1.2rem; cursor: pointer; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        aside {
            width: var(--sidebar-width);
            background-color: #f9f9f9;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 10px;
            background: #eee;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        
        .board-selector {
            display: flex;
            align-items: center;
            background: #e0f7fa;
            border: 1px solid #b2ebf2;
            border-radius: 4px;
            padding: 5px;
        }
        .board-selector select {
            flex: 1;
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            color: #00695c;
        }

        .action-btn {
            font-size: 0.8rem;
            padding: 5px 8px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #999;
            border-radius: 3px;
            width: 100%;
        }
        .action-btn:hover { background: #f0f0f0; }

        .thread-list-item {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            transition: background 0.2s;
        }
        .thread-list-item:hover { background: #f0f0f0; }
        .thread-list-item.active { background: #fff; border-left: 4px solid var(--link-color); }
        .thread-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; display: block; }
        .thread-meta { font-size: 0.75rem; color: #666; display: flex; justify-content: space-between; align-items: center; }
        .momentum { color: var(--accent-color); font-weight: bold; }
        .status-badge { 
            font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: #ddd; 
            border: 1px solid #bbb;
        }
        .status-active { background: #ffeb3b; color: #000; border-color: #d4c125; }
        .status-rom { background: #4CAF50; color: #fff; border-color: #388E3C; }
        .status-api { cursor: pointer; transition: opacity 0.2s; }
        .status-api:hover { opacity: 0.8; }

        main {
            flex: 1;
            overflow-y: auto;
            background-color: var(--thread-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #posts-container {
            padding: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }
        .post { margin-bottom: 25px; border-bottom: 1px dashed #eee; padding-bottom: 15px; }
        .post-header { font-size: 0.85rem; margin-bottom: 5px; }
        .post-num { font-weight: bold; color: green; }
        .post-name { color: #117711; font-weight: bold; }
        .post-date { color: #888; }
        .post-body { font-size: 1rem; white-space: pre-wrap; padding-left: 5px; }
        .anchor { color: var(--link-color); text-decoration: underline; cursor: pointer; }

        .post-form-container {
            padding: 20px;
            border-top: 2px solid var(--border-color);
            background: #f0f0f0;
            position: sticky;
            bottom: 0;
        }
        .post-form { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
        .post-form textarea { flex: 1; height: 60px; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; resize: none; font-family: inherit; }
        .post-form button { padding: 0 20px; background: #e1e1e1; border: 1px solid #999; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        #ai-indicator {
            font-size: 0.7rem;
            background: #ffeb3b;
            color: #d32f2f;
            padding: 2px 8px;
            border: 1px solid #fbc02d;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        #modal-overlay, #apikey-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #apikey-modal-overlay {
            z-index: 200;
        }
        .modal {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal h3 { margin-top: 0; }
        .modal input, .modal select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            aside { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid var(--border-color); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .toast.show { opacity: 1; }
        
        .speed-control-container {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; border: 1px solid #ccc; border-radius: 3px; padding: 2px;
        }
        .speed-control-container select {
            border: none; background: transparent; font-size: 0.8rem; outline: none; cursor: pointer; flex: 1; text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1 onclick="location.reload()">ざつちゃんねる　匿名掲示板 <span style="font-size:0.7rem; color:#888;"></span></h1>
    <div id="global-stats" style="font-size: 0.8rem; color: #666; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <span id="api-key-status" class="status-badge status-api" onclick="openApiKeyModal()">確認中...</span>
        <span id="ai-indicator">通信中...</span>
        <span id="clock-display" style="font-weight: bold; color: #333;"></span>
        <span id="env-display" style="background:#e8f5e9; padding:2px 6px; border-radius:4px; border:1px solid #c8e6c9;"></span>
        <span>接続数: <span id="online-count">0</span> | 総レス数: <span id="total-posts">0</span></span>
    </div>
</header>

<div class="main-container">
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="board-selector">
                <select id="board-select">
                    <option value="daily">日常板</option>
                    <option value="occult">オカルト板</option>
                    <option value="subculture">サブカル板</option>
                </select>
            </div>
            
            <button class="action-btn" id="open-create-modal">新規スレ立て</button>
            <button class="action-btn" id="toggle-rom-mode" style="background: #fff; color: #666; border-color: #ccc;">ROMモード: OFF</button>
            
            <div class="speed-control-container">
                <span style="font-size: 0.75rem; padding-left: 5px; color: #666;">速度:</span>
                <select id="speed-select">
                    <option value="fast">撃早</option>
                    <option value="normal">普通</option>
                    <option value="slow">まったり</option>
                </select>
            </div>

            <button class="action-btn" id="refresh-threads-ai" style="font-size:0.7rem; color:#666;">スレ更新</button>
        </div>
        <div id="thread-list"></div>
    </aside>

    <main id="thread-view">
        <div id="posts-container">
            <div style="padding: 100px; text-align: center; color: #999;">
                左からスレッドを選ぶか、新しく立ててください。<br>
                あなたが書き込んだスレッドのみ「稼働中」となり、レスが付きます。<br>
                ROMモードをONにすると、見ているスレが勝手に進みます。
            </div>
        </div>
        <div class="post-form-container" id="form-container" style="display:none;">
            <div class="post-form">
                <textarea id="post-input" placeholder="ここに書き込む..."></textarea>
                <button id="post-btn">書き込む</button>
            </div>
        </div>
    </main>
</div>

<!-- スレッド作成 Modal -->
<div id="modal-overlay">
    <div class="modal">
        <h3>新規スレッド作成</h3>
        <label style="font-size: 0.8rem;">スレッドタイトル</label>
        <input type="text" id="new-thread-title" placeholder="例：最近買った便利なもの">
        <label style="font-size: 0.8rem;">スレッドの雰囲気</label>
        <select id="new-thread-personality">
            <option value="chill">chill (まったり・平和)</option>
            <option value="snarky">snarky (ツッコミ・殺伐)</option>
            <option value="chaotic">chaotic (カオス・脱線)</option>
            <option value="normal">normal (標準・一般的)</option>
            <option value="story">story (体験談・実況・語り)</option>
        </select>
        <div class="modal-btns">
            <button class="action-btn" style="width:auto;" id="close-modal">キャンセル</button>
            <button class="action-btn" style="width:auto; background:#007bff; color:#fff; border-color:#007bff;" id="create-thread-confirm">スレを立てる</button>
        </div>
    </div>
</div>

<!-- APIキー設定 Modal -->
<div id="apikey-modal-overlay">
    <div class="modal">
        <h3>🔑 Gemini APIキー設定</h3>
        <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">
            AIを動作させるにはGoogle GeminiのAPIキーが必要です。<br>
            ※キーはお使いのブラウザ内にのみ保存されます。
        </p>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
        <div class="modal-btns">
            <button class="action-btn" style="width:auto;" id="close-apikey-modal">閉じる</button>
            <button class="action-btn" style="width:auto; background:#4CAF50; color:#fff; border-color:#388E3C;" id="save-apikey-confirm">保存して反映</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
/**
 * Configuration & Constants
 */
let apiKey = localStorage.getItem('dobatto_api_key') || ""; 
const SAVE_DATA_KEY = 'zatchannel_bbs_save_data';

const BOARD_INFO = {
    'daily': '日常板（日々の雑談、生活の知恵、愚痴、ほのぼのした話題が中心）',
    'occult': 'オカルト板（幽霊、UFO、都市伝説、陰謀論、怖い話、不思議な体験が中心）',
    'subculture': 'サブカル板（アニメ、漫画、ゲーム、アイドル、芸能人、ネットカルチャーが中心）'
};

let state = {
    threads: [],
    activeThreadId: null,
    currentBoard: 'daily',
    onlineCount: Math.floor(Math.random() * 50) + 120,
    isAIWorking: false,
    romMode: false,
    speedMode: 'normal', 
    environment: null,
    worldSetting: "" 
};

/**
 * ぼかしルールのランダム生成
 */
function getObfuscationRule() {
    const r = Math.random();
    if (r < 0.30) return "「あの〇〇」「例のやつ」「あそこ」のような【遠回しな言い方】";
    else if (r < 0.55) return "「青い看板のとこ」「弁当強いとこ」「やたら混むあの店」のような【特徴をぼかした言い方】";
    else if (r < 0.75) return "「某コンビニ」「某アイドル」のような【某〇〇という言い方】";
    else if (r < 0.90) return "「名前忘れたけど」「なんだっけあれ」「確かそんな感じの」のような【うろ覚えな言い方】";
    else return "「デ○ステ」「サク○ト」「キ○ハチ」のような【一部を伏せ字にした言い方】";
}

/**
 * APIキーステータス管理
 */
function updateApiKeyStatus(status) {
    const badge = document.getElementById('api-key-status');
    if (status === 'ok') {
        badge.textContent = "API連携OK";
        badge.style.background = "#4CAF50";
        badge.style.borderColor = "#388E3C";
        badge.style.color = "#fff";
    } else if (status === 'error') {
        badge.textContent = "APIキーエラー";
        badge.style.background = "#f44336";
        badge.style.borderColor = "#d32f2f";
        badge.style.color = "#fff";
    } else {
        badge.textContent = "APIキー未設定";
        badge.style.background = "#ffeb3b";
        badge.style.borderColor = "#fbc02d";
        badge.style.color = "#000";
    }
}

function openApiKeyModal() {
    document.getElementById('api-key-input').value = apiKey;
    document.getElementById('apikey-modal-overlay').style.display = 'flex';
}

function closeApiKeyModal() {
    document.getElementById('apikey-modal-overlay').style.display = 'none';
}

function saveApiKey() {
    apiKey = document.getElementById('api-key-input').value.trim();
    localStorage.setItem('dobatto_api_key', apiKey);
    closeApiKeyModal();
    if (apiKey) {
        updateApiKeyStatus('ok');
        showToast("APIキーを保存しました");
    } else {
        updateApiKeyStatus('missing');
    }
}

/**
 * 外部テキストファイル（world_setting.txt）の読み込み
 */
async function loadWorldSetting() {
    try {
        const response = await fetch('world_setting.txt');
        if (response.ok) {
            state.worldSetting = await response.text();
            console.log("世界観設定を読み込みました。");
        } else {
            console.log("world_setting.txt は見つかりませんでした。通常モードで動作します。");
            state.worldSetting = "";
        }
    } catch (e) {
        console.log("world_setting.txt の読み込みをスキップしました (CORS等の制限)。通常モードで動作します。");
        state.worldSetting = "";
    }
}

/**
 * Gemini API Integration
 */
async function callGemini(userQuery, systemPrompt) {
    if (!apiKey) {
        updateApiKeyStatus('missing');
        showToast("APIキーを設定してください");
        openApiKeyModal();
        return null;
    }

    const isCanvas = typeof __app_id !== 'undefined';
    const model = isCanvas ? "gemini-2.5-flash-preview-09-2025" : "gemini-3-flash-preview";
    const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + apiKey;
    
    const payload = {
        contents: [{ parts: [{ text: userQuery }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
    };

    let delay = 1000;
    for (let i = 0; i < 3; i++) { 
        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                updateApiKeyStatus('ok');
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) return text;
            } else {
                if (response.status === 400 || response.status === 403) {
                    updateApiKeyStatus('error');
                    console.error("Gemini API Auth Error:", response.status);
                    showToast("APIキーが無効です。再設定してください。");
                    openApiKeyModal();
                    break; 
                } else if (response.status === 404) {
                    console.error("Gemini API Model Not Found Error:", response.status);
                    showToast("指定されたAIモデルが見つかりません。");
                    break;
                }
                console.error("Gemini API Error:", response.status, await response.text());
            }
        } catch (e) {}
        
        if (i < 2) {
            await new Promise(res => setTimeout(res, delay));
            delay *= 2;
        }
    }
    return null;
}

/**
 * Environment Logic (Season, Time, Weather)
 */
function updateEnvironment() {
    const now = new Date();
    const month = now.getMonth() + 1;
    const hour = now.getHours();
    
    let season = "冬";
    if (month >= 3 && month <= 5) season = "春";
    else if (month >= 6 && month <= 8) season = "夏";
    else if (month >= 9 && month <= 11) season = "秋";

    let timeOfDay = "深夜";
    if (hour >= 5 && hour < 11) timeOfDay = "朝";
    else if (hour >= 11 && hour < 15) timeOfDay = "昼";
    else if (hour >= 15 && hour < 18) timeOfDay = "夕方";
    else if (hour >= 18 && hour < 23) timeOfDay = "夜";

    if (!state.environment || now.getTime() - (state.environment.lastUpdate || 0) > 3600000) {
        let weather = "晴れ";
        const r = Math.random();
        if (season === "春") weather = r < 0.6 ? "晴れ" : (r < 0.9 ? "曇り" : "雨");
        else if (season === "夏") {
            if (month === 6) weather = r < 0.3 ? "晴れ" : (r < 0.7 ? "雨" : "曇り");
            else weather = r < 0.6 ? "晴れ" : (r < 0.8 ? "曇り" : "夕立");
        }
        else if (season === "秋") weather = r < 0.6 ? "晴れ" : (r < 0.85 ? "曇り" : "雨");
        else weather = r < 0.6 ? "晴れ" : (r < 0.8 ? "曇り" : (r < 0.95 ? "雨" : "雪")); 

        state.environment = { season, timeOfDay, weather, lastUpdate: now.getTime() };
    } else {
        state.environment.timeOfDay = timeOfDay;
        state.environment.season = season;
    }
    
    const envIcons = { "晴れ": "☀️", "曇り": "☁️", "雨": "☔", "夕立": "⛈️", "雪": "❄️" };
    const icon = envIcons[state.environment.weather] || "";
    document.getElementById('env-display').textContent = `${state.environment.season} / ${state.environment.timeOfDay} / ${icon}${state.environment.weather}`;
}

function updateClock() {
    const now = new Date();
    const clockEl = document.getElementById('clock-display');
    if (clockEl) {
        clockEl.textContent = formatDate(now);
    }
}

/**
 * 速度制御と乱数の計算
 */
function calculateCooldown(speed, isRom, isActiveView) {
    let base = 3000;
    let rand = 2000;
    
    switch (speed) {
        case 'fast':
            base = isRom ? 1000 : 1500;
            rand = 1500; 
            break;
        case 'normal':
            base = isRom ? 2500 : 4000;
            rand = 3000; 
            break;
        case 'slow':
            base = isRom ? 6000 : 10000;
            rand = 5000; 
            break;
    }
    
    let cooldown = base + Math.random() * rand;
    if (!isActiveView) cooldown *= 1.5;
    
    return cooldown;
}

/**
 * セーブとロード
 */
function saveState() {
    localStorage.setItem(SAVE_DATA_KEY, JSON.stringify(state));
}

async function init() {
    let saved = localStorage.getItem(SAVE_DATA_KEY);
    
    if (saved) {
        try {
            state = JSON.parse(saved);
            if (!state.speedMode || state.speedMode === 'pause') state.speedMode = 'normal';
            if (!state.currentBoard) state.currentBoard = 'daily';
            state.threads.forEach(t => {
                if (t.isActive === undefined) t.isActive = t.userHasPosted || false;
                if (!t.board) t.board = 'daily'; 
                if (!t.responseQueue) t.responseQueue = [];
                if (!t.lastAIPostTime) t.lastAIPostTime = t.lastUpdate || 0;
                if (!t.nextCooldown) t.nextCooldown = calculateCooldown(state.speedMode, state.romMode, false);
                if (t.opPersona === undefined) t.opPersona = null; 
            });
        } catch(e) {
            console.error("Save data parsing error", e);
        }
    }
    
    await loadWorldSetting();

    state.isAIWorking = false;
    setAIWorking(false);
    
    if (apiKey) {
        updateApiKeyStatus('ok');
    } else {
        updateApiKeyStatus('missing');
        setTimeout(openApiKeyModal, 500);
    }
    
    document.getElementById('speed-select').value = state.speedMode || 'normal';
    document.getElementById('board-select').value = state.currentBoard || 'daily';

    updateEnvironment(); 
    updateClock();
    updateRomButtonUI();
    renderThreadList();
    updateGlobalStats();
    
    setInterval(updateEnvironment, 60000); 
    setInterval(updateClock, 1000);
    setInterval(tickSimulation, 1000); 
    setInterval(updateOnlineCount, 20000);

    document.getElementById('post-btn').addEventListener('click', handleUserPost);
    document.getElementById('open-create-modal').addEventListener('click', () => {
        document.getElementById('modal-overlay').style.display = 'flex';
    });
    document.getElementById('close-modal').addEventListener('click', () => {
        document.getElementById('modal-overlay').style.display = 'none';
    });
    document.getElementById('create-thread-confirm').addEventListener('click', createNewThreadManual);
    document.getElementById('refresh-threads-ai').addEventListener('click', generateAIThreadsSuggestion);
    document.getElementById('toggle-rom-mode').addEventListener('click', toggleRomMode);
    
    document.getElementById('close-apikey-modal').addEventListener('click', closeApiKeyModal);
    document.getElementById('save-apikey-confirm').addEventListener('click', saveApiKey);
    
    document.getElementById('speed-select').addEventListener('change', (e) => {
        state.speedMode = e.target.value;
        saveState();
    });

    document.getElementById('board-select').addEventListener('change', (e) => {
        state.currentBoard = e.target.value;
        document.getElementById('posts-container').innerHTML = `
            <div style="padding: 100px; text-align: center; color: #999;">
                ${e.target.options[e.target.selectedIndex].text} に移動しました。<br>
                左からスレッドを選ぶか、新しく立ててください。
            </div>`;
        document.getElementById('form-container').style.display = 'none';
        state.activeThreadId = null;
        renderThreadList();
        saveState();
    });

    document.getElementById('thread-list').addEventListener('click', (e) => {
        const item = e.target.closest('.thread-list-item');
        if (item) openThread(Number(item.dataset.id));
    });
}

function createNewThreadManual() {
    const title = document.getElementById('new-thread-title').value.trim();
    const personality = document.getElementById('new-thread-personality').value;
    if (!title) return;

    const newThread = {
        id: Date.now(),
        board: state.currentBoard,
        title: title,
        personality: personality,
        opPersona: null, 
        posts: [],
        responseQueue: [],
        momentum: 0,
        lastUpdate: Date.now(),
        lastAIPostTime: 0,
        nextCooldown: calculateCooldown(state.speedMode, state.romMode, true),
        isActive: false
    };

    state.threads.unshift(newThread);
    document.getElementById('modal-overlay').style.display = 'none';
    document.getElementById('new-thread-title').value = '';
    
    renderThreadList();
    openThread(newThread.id);
    saveState();
}

async function generateAIThreadsSuggestion() {
    if (state.isAIWorking) return;
    setAIWorking(true);

    const envInfo = `【現在設定】季節:${state.environment.season} / 時間帯:${state.environment.timeOfDay} / 天気:${state.environment.weather}`;
    const boardDesc = BOARD_INFO[state.currentBoard];
    const worldSettingPrompt = state.worldSetting ? `\n【この掲示板が存在する世界の設定：ここを絶対基準にすること】\n${state.worldSetting}\n` : "";
    
    let dynamicRules = "";
    if (Math.random() < 0.10) {
        dynamicRules += "・【許可】スレタイや本文に、あらゆる固有名詞をそのまま含めても構いません。\n";
    } else {
        dynamicRules += "・【許可】「AI」「Twitter/X」「YouTube」「東京」「大阪」など、誰もが知る広く普及している固有名詞や地名はそのまま使用してください。\n";
        dynamicRules += `・【禁止】しかし、アニメ・ゲーム等のサブカル作品名、地方のマイナーな地名、特定の電車の路線や色、ローカルチェーン店など「知る人ぞ知る固有名詞」はそのまま出さず、必ず${getObfuscationRule()}にしてください。\n`;
    }

    // 体験談スレの出現確率を5%以下に制限
    if (Math.random() < 0.05) {
        dynamicRules += "・【指示】今回生成する5つのスレッドのうち、1つだけを「体験談スレ（story）」として作成してください。FIRST_POSTは「今から〇〇の話するけど聞くやついる？」のような語り出しにしてください。\n";
    } else {
        dynamicRules += "・【禁止】今回は「体験談スレ（story）」は絶対に生成しないでください。すべて通常の雑談スレ（chill, snarky, chaotic, normal のいずれか）にしてください。\n";
    }

    const systemPrompt = `あなたは現実の日本をベースにした世界に存在する匿名掲示板「ざっちゃんねる」のスレッド作成機です。
現在選択されている板は「${boardDesc}」です。
この板のテーマに沿って、今のネットで受けそうな雑談スレッドを5つ考えてください。
${envInfo}${worldSettingPrompt}

【大前提】
・現実の日本がベースの世界です。東京や大阪などの実在の地名、現代社会の一般常識はすべて当たり前に存在しています。
・その上で、追加の世界設定があれば、それが融合したパラレルワールドとして振る舞ってください。

※この時期や天気に影響されたスレッドは、全体の1つあるかないか（ごく稀）にしてください。無理に入れる必要はありません。

【今回の動的ルール（厳密に従うこと）】
${dynamicRules}

【重要】各スレッドは必ず以下のフォーマットで出力してください。NAMEは基本「名無しさん」ですがたまにコテハンにしてください。
PERSONALITYには、chill または snarky または chaotic または normal （許可されている場合のみ story）のいずれかを入れてください。

[THREAD]
[TITLE]スレタイ[END_TITLE]
[PERSONALITY]chill または snarky または chaotic または normal または story[END_PERSONALITY]
[NAME]スレ主の名前[END_NAME]
[OP_PERSONA]このスレを立てたスレ主（>>1）の詳細なキャラクター像・年齢層・口調・境遇（例: 限界アラサー営業職、やたらテンション高い学生、関西弁のオタク など）[END_OP_PERSONA]
[FIRST_POST]1レス目の本文[END_FIRST_POST]
[END_THREAD]`;

    try {
        const responseText = await callGemini("面白いスレタイを5つ考えて", systemPrompt);
        if (responseText) {
            const cleanedText = responseText.replace(new RegExp('\\u0060\\u0060\\u0060(?:xml|html|json)?\\n?', 'gi'), '').replace(new RegExp('\\u0060\\u0060\\u0060', 'g'), '').trim();
            const threads = [];
            
            const threadMatches = [...cleanedText.matchAll(/\[THREAD\]([\s\S]*?)\[END_THREAD\]/gi)];
            
            for (const tm of threadMatches) {
                const block = tm[1];
                const titleMatch = block.match(/\[TITLE\]([\s\S]*?)\[END_TITLE\]/i);
                const persMatch = block.match(/\[PERSONALITY\]([\s\S]*?)\[END_PERSONALITY\]/i);
                const nameMatch = block.match(/\[NAME\]([\s\S]*?)\[END_NAME\]/i);
                const opPersonaMatch = block.match(/\[OP_PERSONA\]([\s\S]*?)\[END_OP_PERSONA\]/i);
                const firstMatch = block.match(/\[FIRST_POST\]([\s\S]*?)\[END_FIRST_POST\]/i);
                
                if (titleMatch && firstMatch) {
                    let personality = persMatch ? persMatch[1].trim().toLowerCase() : 'normal';
                    if (!['chill', 'snarky', 'chaotic', 'normal', 'story'].includes(personality)) personality = 'normal';
                    
                    let posterName = nameMatch ? nameMatch[1].trim() : "名無しさん";
                    let opPersona = opPersonaMatch ? opPersonaMatch[1].trim() : null;

                    threads.push({
                        title: titleMatch[1].trim(),
                        personality: personality,
                        opPersona: opPersona,
                        posterName: posterName,
                        firstPost: firstMatch[1].trim()
                    });
                }
            }

            if (threads.length > 0) {
                threads.forEach(t => {
                    state.threads.unshift({
                        id: Date.now() + Math.random(),
                        board: state.currentBoard, 
                        title: t.title,
                        personality: t.personality,
                        opPersona: t.opPersona,
                        posts: [{
                            num: 1,
                            name: t.posterName,
                            date: formatDate(new Date()),
                            body: t.firstPost || "スレ立ててみた",
                            isAI: true
                        }],
                        responseQueue: [],
                        momentum: 10,
                        lastUpdate: Date.now(),
                        lastAIPostTime: Date.now(),
                        nextCooldown: calculateCooldown(state.speedMode, state.romMode, false),
                        isActive: false
                    });
                });
                saveState(); 
            } else {
                showToast("データ解析に失敗しました。再試行してください。");
            }
        }
    } catch(e) {
        console.error("Threads Generate Error:", e);
    } finally {
        setAIWorking(false);
        renderThreadList();
    }
}

function toggleRomMode() {
    state.romMode = !state.romMode;
    updateRomButtonUI();
    
    const thread = state.threads.find(t => t.id === state.activeThreadId);
    if (thread) {
        const badge = document.getElementById('thread-status-badge');
        if (badge) {
            if (state.romMode) {
                badge.textContent = "ROM中";
                badge.style.background = "#4CAF50";
                badge.style.color = "#fff";
            } else {
                const isWorking = thread.isActive || thread.responseQueue.length > 0;
                badge.textContent = isWorking ? "稼働中" : "待機中";
                badge.style.background = isWorking ? "#ffeb3b" : "#ddd";
                badge.style.color = isWorking ? "#000" : "#666";
            }
        }
    }
    
    renderThreadList();
    saveState();
}

function updateRomButtonUI() {
    const btn = document.getElementById('toggle-rom-mode');
    if (state.romMode) {
        btn.textContent = 'ROMモード: ON (閲覧スレ強制進行)';
        btn.style.background = '#4CAF50';
        btn.style.color = '#fff';
        btn.style.borderColor = '#4CAF50';
    } else {
        btn.textContent = 'ROMモード: OFF';
        btn.style.background = '#fff';
        btn.style.color = '#666';
        btn.style.borderColor = '#ccc';
    }
}

function escapeHTML(str) {
    return str.split('&').join('&amp;')
              .split('<').join('&lt;')
              .split('>').join('&gt;')
              .split('"').join('&quot;')
              .split("'").join('&#39;');
}

function appendPostToDOM(post) {
    const container = document.getElementById('posts-container');
    const emptyMsg = container.querySelector('.empty-msg');
    if (emptyMsg) emptyMsg.remove();

    if (!container.querySelector('h2')) {
        renderPosts();
        return;
    }

    let displayBody = escapeHTML(post.body).replace(new RegExp('(&gt;&gt;\\d+)', 'g'), '<span class="anchor">$1</span>');

    const html = `
        <div class="post">
            <div class="post-header">
                <span class="post-num">${post.num}</span> ：<span class="post-name">${escapeHTML(post.name)}</span> ：<span class="post-date">${post.date}</span>
            </div>
            <div class="post-body">${displayBody}</div>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', html);

    const main = document.getElementById('thread-view');
    if (main.scrollHeight - main.scrollTop - main.clientHeight < 150) {
        main.scrollTop = main.scrollHeight;
    }
}

function executePost(thread, payload, isUser, silent = false) {
    const newNum = thread.posts.length + 1;
    
    let postName = "名無しさん";
    let postBody = "";

    if (typeof payload === 'string') {
        postBody = payload;
    } else if (payload && typeof payload === 'object') {
        postName = payload.name || "名無しさん";
        postBody = payload.body || "";
    }

    if (isUser) {
        postName = "◆YOU";
    }

    const post = {
        num: newNum,
        name: postName,
        date: formatDate(new Date()), 
        body: postBody,
        isAI: !isUser
    };

    thread.posts.push(post);
    
    if (isUser) {
        state.threads.forEach(t => t.isActive = false);
        thread.isActive = true; 
        
        const badge = document.getElementById('thread-status-badge');
        if (badge) {
            badge.textContent = state.romMode ? "ROM中" : "稼働中";
            badge.style.background = state.romMode ? "#4CAF50" : "#ffeb3b";
            badge.style.color = state.romMode ? "#fff" : "#000";
        }

        if (thread.responseQueue.length <= 1 && !state.isAIWorking) {
            fetchAndQueueResponses(thread);
        }

        thread.momentum = Math.min(100, thread.momentum + 50);
        thread.nextCooldown = calculateCooldown(state.speedMode, state.romMode, true) * 0.5;
    } else {
        thread.momentum = Math.min(100, thread.momentum + 10);
    }
    
    thread.lastUpdate = Date.now();
    if (!isUser) {
        thread.lastAIPostTime = Date.now();
    }

    if (thread.id === state.activeThreadId && !silent) {
        appendPostToDOM(post);
        if (!isUser) showToast("新着レスあり");
    }
    
    updateGlobalStats();
    renderThreadList();
    saveState(); 
}

async function tickSimulation() {
    for (let thread of state.threads) {
        thread.momentum = Math.max(0, thread.momentum - 2);

        if (state.romMode && thread.id === state.activeThreadId) {
            thread.momentum = Math.max(30, thread.momentum);
        }

        const isActiveView = (thread.id === state.activeThreadId);
        const timeSinceLastAIPost = Date.now() - (thread.lastAIPostTime || 0);

        if (!state.romMode && thread.isActive && thread.responseQueue.length === 0 && !state.isAIWorking) {
            thread.isActive = false;
            if (isActiveView) {
                const badge = document.getElementById('thread-status-badge');
                if (badge) {
                    badge.textContent = "待機中";
                    badge.style.background = "#ddd";
                    badge.style.color = "#666";
                }
            }
            saveState(); 
        }

        if (state.romMode && isActiveView) {
            if (thread.responseQueue.length <= 1 && !state.isAIWorking) {
                fetchAndQueueResponses(thread);
            }
        }

        if (thread.responseQueue && thread.responseQueue.length > 0) {
            if (!thread.nextCooldown) {
                thread.nextCooldown = calculateCooldown(state.speedMode, state.romMode, isActiveView);
            }
            
            const cooldown = thread.nextCooldown;
            
            if (timeSinceLastAIPost > cooldown) {
                const popThreshold = isActiveView ? 1.0 : 0.3; 
                if (Math.random() < popThreshold) {
                    const postData = thread.responseQueue.shift();
                    executePost(thread, postData, false);
                    thread.nextCooldown = calculateCooldown(state.speedMode, state.romMode, isActiveView);
                }
            }
        }
    }
    renderThreadList();
}

function setAIWorking(working) {
    state.isAIWorking = working;
    const indicator = document.getElementById('ai-indicator');
    if (indicator) {
        indicator.style.display = working ? 'inline-block' : 'none';
    }
}

function renderThreadList() {
    const listEl = document.getElementById('thread-list');
    
    const boardThreads = state.threads.filter(t => (t.board || 'daily') === state.currentBoard);
    
    if (!boardThreads.length) {
        listEl.innerHTML = '<div style="padding:20px; color:#999; text-align:center;">この板にはスレがありません</div>';
        return;
    }
    
    const sorted = [...boardThreads].sort((a, b) => b.lastUpdate - a.lastUpdate);
    listEl.innerHTML = sorted.map(t => {
        const isRomActive = state.romMode && t.id === state.activeThreadId;
        const isWorking = !isRomActive && (t.responseQueue.length > 0 || (state.isAIWorking && t.isActive));
        const badgeClass = isRomActive ? 'status-rom' : (isWorking ? 'status-active' : '');
        const badgeText = isRomActive ? 'ROM中' : (isWorking ? '稼働中' : '待機中');
        
        return `
        <div class="thread-list-item ${t.id === state.activeThreadId ? 'active' : ''}" data-id="${t.id}">
            <span class="thread-title">${t.title}</span>
            <div class="thread-meta">
                <span>レス: ${t.posts.length}</span>
                <span class="status-badge ${badgeClass}">${badgeText}</span>
            </div>
        </div>
        `;
    }).join('');
}

function openThread(id) {
    state.activeThreadId = id;
    renderThreadList();
    renderPosts();
    document.getElementById('form-container').style.display = 'block';
    const main = document.getElementById('thread-view');
    setTimeout(() => main.scrollTop = main.scrollHeight, 50);
}

function renderPosts() {
    const container = document.getElementById('posts-container');
    const thread = state.threads.find(t => t.id === state.activeThreadId);
    if (!thread) return;

    const isRomActive = state.romMode && thread.id === state.activeThreadId;
    const isWorking = !isRomActive && (thread.responseQueue.length > 0 || (state.isAIWorking && thread.isActive));
    
    const btnText = isRomActive ? "ROM中" : (isWorking ? "稼働中" : "待機中");
    const btnColor = isRomActive ? "#4CAF50" : (isWorking ? "#ffeb3b" : "#ddd");
    const btnTextColor = isRomActive ? "#fff" : (isWorking ? "#000" : "#666");

    let html = `
        <div style="border-bottom: 2px solid #ccc; padding-bottom:10px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
            <h2 style="font-size:1.1rem; margin:0;">${thread.title}</h2>
            <span id="thread-status-badge" style="font-size:0.75rem; padding:4px 10px; background:${btnColor}; color:${btnTextColor}; border:1px solid #999; border-radius:3px; font-weight:bold;">
                ${btnText}
            </span>
        </div>
    `;
    
    if (thread.posts.length === 0) {
        html += '<div class="empty-msg" style="padding:50px; text-align:center; color:#999;">まだ書き込みがありません。<br>自分で書き込むと「稼働中」になり、AIのレスが付き始めます。</div>';
    } else {
        html += thread.posts.map(p => {
            let displayBody = escapeHTML(p.body).replace(new RegExp('(&gt;&gt;\\d+)', 'g'), '<span class="anchor">$1</span>');
            return `
            <div class="post">
                <div class="post-header">
                    <span class="post-num">${p.num}</span> ：<span class="post-name">${escapeHTML(p.name)}</span> ：<span class="post-date">${p.date}</span>
                </div>
                <div class="post-body">${displayBody}</div>
            </div>`;
        }).join('');
    }
    
    container.innerHTML = html;
}

async function handleUserPost() {
    const input = document.getElementById('post-input');
    const text = input.value.trim();
    if (!text) return;

    const thread = state.threads.find(t => t.id === state.activeThreadId);
    if (!thread) return;

    executePost(thread, text, true);
    input.value = '';
}

function updateGlobalStats() {
    const total = state.threads.reduce((sum, t) => sum + t.posts.length, 0);
    document.getElementById('online-count').textContent = state.onlineCount;
    document.getElementById('total-posts').textContent = total;
}

function updateOnlineCount() {
    state.onlineCount += Math.floor(Math.random() * 11) - 5;
    state.onlineCount = Math.max(30, state.onlineCount);
    updateGlobalStats();
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function formatDate(date) {
    const d = new Date(date);
    const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
    return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}(${dayNames[d.getDay()]}) ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
}

window.onload = init;
</script>
</body>
</html>
